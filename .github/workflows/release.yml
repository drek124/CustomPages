name: Release

# Builds com_custompages-<version>.zip and attaches it to the GitHub release.
# The release tag (e.g. v1.2.0 or 1.2.0) must match <version> in custompages.xml.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint PHP
        run: find com_custompages -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate XML
        run: |
          find com_custompages -name '*.xml' -print0 \
            | xargs -0 -n1 python -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1]); print('ok', sys.argv[1])"

      - name: Build ZIP
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          zip="$(python build.py --version "$version" --out-dir dist)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          unzip -l "$zip"

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
