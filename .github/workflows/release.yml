name: Release

# Builds com_custompages-<version>.zip plus the Joomla update feed (updates.xml)
# and attaches both to the GitHub release.
# The release tag (e.g. v1.2.0 or 1.2.0) must match <version> in custompages.xml.
# Only full releases update Joomla sites: "latest" skips pre-releases.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint PHP
        run: find com_custompages -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate XML
        run: |
          find com_custompages -name '*.xml' -print0 \
            | xargs -0 -n1 python -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1]); print('ok', sys.argv[1])"

      - name: Build ZIP and update feed
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          python build.py --version "$version" --out-dir dist --repo "$GITHUB_REPOSITORY" --tag "$TAG"
          echo "zip=dist/com_custompages-$version.zip" >> "$GITHUB_OUTPUT"
          unzip -l "dist/com_custompages-$version.zip"
          cat dist/updates.xml

      # updates.xml on the newest release is what Joomla sites poll through
      # releases/latest/download/updates.xml (see <updateservers> in the manifest).
      - name: Attach ZIP and updates.xml to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" dist/updates.xml --clobber --repo "$GITHUB_REPOSITORY"
