name: CI

# Lints the component on every supported PHP version and checks that the package builds.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: find com_custompages -name '*.php' -print0 | xargs -0 -n1 php -l

  package:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate XML
        run: |
          find com_custompages -name '*.xml' -print0 \
            | xargs -0 -n1 python -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1]); print('ok', sys.argv[1])"

      - name: Build ZIP
        id: build
        run: |
          zip="$(python build.py --out-dir dist)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
