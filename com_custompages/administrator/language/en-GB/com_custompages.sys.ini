COM_CUSTOMPAGES="Custom Pages"
COM_CUSTOMPAGES_XML_DESCRIPTION="Write complete HTML pages (with optional PHP) in CodeMirror and publish them as menu items. The frontend output bypasses the site template entirely."
COM_CUSTOMPAGES_MENU_PAGES="Pages"

COM_CUSTOMPAGES_VIEW_PAGE_TITLE="Custom Page"
COM_CUSTOMPAGES_VIEW_PAGE_DESC="Runs a stored page (HTML with optional PHP) and outputs it as the complete response, or inside a module position of a site template."
COM_CUSTOMPAGES_SELECT_PAGE="Select Page"
COM_CUSTOMPAGES_FIELD_CACHE_CONTROL_LABEL="Cache-Control Header"
COM_CUSTOMPAGES_FIELD_CACHE_CONTROL_DESC="Optional value for the HTTP Cache-Control response header, e.g. <code>public, max-age=300</code>. Leave empty to send none. Pages not visible to the Public access level always get <code>private, no-cache</code>."
COM_CUSTOMPAGES_FIELDSET_HTTP_LABEL="HTTP"
COM_CUSTOMPAGES_FIELDSET_TEMPLATE_LABEL="Template"
COM_CUSTOMPAGES_FIELD_TEMPLATE_STYLE_LABEL="Template Style"
COM_CUSTOMPAGES_FIELD_TEMPLATE_STYLE_DESC="<strong>No template</strong> outputs the page as the complete response, with nothing added. <strong>Default</strong> uses the template style Joomla would normally use for this menu item. Picking a template style renders the page inside that template, in the chosen position."
COM_CUSTOMPAGES_TEMPLATE_STYLE_NONE="No template"
COM_CUSTOMPAGES_TEMPLATE_STYLE_DEFAULT="Default"
COM_CUSTOMPAGES_FIELD_TEMPLATE_POSITION_LABEL="Position"
COM_CUSTOMPAGES_FIELD_TEMPLATE_POSITION_DESC="Required. The template module position the page is placed in, without module chrome, after any modules already in that position."
COM_CUSTOMPAGES_FIELD_TEMPLATE_POSITION_REQUIRED="Select a position for the page when a template style is used."
COM_CUSTOMPAGES_TEMPLATE_POSITION_SELECT="- Select Position -"
